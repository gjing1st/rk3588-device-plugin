apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rk3588-npu-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: rk3588-npu-device-plugin
  template:
    metadata:
      labels:
        name: rk3588-npu-device-plugin
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # 先给 RK3588 节点打标签:
                  #   kubectl label node <node1> <node2> hardware-type=rk3588
                  - key: hardware-type
                    operator: In
                    values:
                      - rk3588

      hostNetwork: true
      priorityClassName: system-node-critical

      containers:
        - name: rk3588-npu-plugin
          # 部署前请替换为你自己的镜像地址
          image: your-registry/rk3588-device-plugin:v1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 50m
              memory: 50Mi
            limits:
              cpu: 100m
              memory: 100Mi
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev-dri
              mountPath: /dev/dri
            - name: sys-class-drm
              mountPath: /sys/class/drm
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev-dri
          hostPath:
            path: /dev/dri
        - name: sys-class-drm
          hostPath:
            path: /sys/class/drm

  updateStrategy:
    type: RollingUpdate
